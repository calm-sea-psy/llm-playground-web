# 기본 보안 헤더: 내용 형식 추측 금지 · 다른 사이트의 iframe 에 넣기 금지 · 다른 사이트로 주소를 넘기지 않기.
# nginx.conf 의 server 와, add_header 를 따로 쓰는 location 에서 include 한다
# (nginx 는 add_header 를 따로 쓴 location 에 server 의 add_header 를 물려주지 않는다).
# Dockerfile 이 /etc/nginx/snippets/ 에 둔다. conf.d/ 의 *.conf 는 nginx 가 http 블록에서 모두 읽으므로 그 밖에 둔다
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
